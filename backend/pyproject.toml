[project]
name = "ns3-editor-backend"
version = "0.1.0"
description = "Backend for the ns-3 scenario editor GUI: scenario schema, C++ code generation, and ./ns3 run integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
